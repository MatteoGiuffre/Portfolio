    <!-- MODALE PROJET -->
    <div id="modal-projet" class="modal-projet" style="display:none; position:fixed; inset:0; background:rgba(2,6,23,0.6); align-items:center; justify-content:center; z-index:2000;">

            <button class="modal-close" aria-label="Fermer la modale" style="float:right;background:transparent;border:0;font-size:1.25rem;cursor:pointer;">&times;</button>
            <div id="modal-body" class="modal-body" style="clear:both;">
                <!-- Le contenu du projet sera injecté ici par JS -->
            </div>
        </div>
    </div>

<script>
// Contenus personnalisés pour chaque projet (texte repris de votre ancien code)
const projetsContent = {
    SAE11: `
        <h2 style="text-align:center;font-size:2rem;font-weight:800;margin-bottom:.5rem;">SE SENSIBILISER À L'HYGIÈNE INFORMATIQUE ET À LA CYBERSÉCURITÉ</h2>
        <div style="text-align:center;">
            <img src="cyberhygiene.jpg" alt="Hygiène info et cybersécurité" style="max-width:360px;width:80%;margin:0 auto 1.2rem auto;display:block;border-radius:8px;">
        </div>
        <p style="font-size:1rem;line-height:1.45;">
            <strong>Objectif :</strong><br>
            Comprendre les concepts clés de la cybersécurité : vulnérabilités, menaces et attaques. Identifier les principaux risques et proposer des moyens de prévention.
        </p>
        <p style="font-size:1rem;line-height:1.45;">
            <strong>Travail réalisé :</strong><br>
            Recherches et analyses sur différents types d'attaques (cybercriminalité, espionnage, sabotage), présentation orale et réalisation d'une courte vidéo de sensibilisation destinée à un public non spécialisé.
        </p>
        <p style="font-size:1rem;line-height:1.45;">
            <strong>Compétences développées :</strong><br>
            Analyse d'incidents, synthèse technique, vulgarisation et communication.
        </p>
        <div style="text-align:center; margin-top:1.2rem;">
            <a href="SAE11.pdf" class="btn-proof" target="_blank" rel="noopener">Compte rendu (SAE11)</a>
        </div>
    `,
    SAE12: `
        <h2 style="text-align:center;font-size:2rem;font-weight:800;margin-bottom:.5rem;">S'INITIER AUX RÉSEAUX INFORMATIQUES</h2>
        <div style="text-align:center;">
            <img src="reseauxinformatiques.jpg" alt="S'initier aux réseaux informatiques" style="max-width:360px;width:80%;margin:0 auto 1.2rem auto;display:block;border-radius:8px;">
        </div>
        <p style="font-size:1rem;line-height:1.45;">
            <strong>Objectif :</strong><br>
            Comprendre le fonctionnement d’un réseau domestique et analyser composants et interactions.
        </p>
        <p style="font-size:1rem;line-height:1.45;">
            <strong>Travail réalisé :</strong><br>
            Tests et configuration d'un réseau domestique, identification des équipements, mesures de débits et comptes-rendus détaillés avec supports vidéo.
        </p>
        <p style="font-size:1rem;line-height:1.45;">
            <strong>Compétences développées :</strong><br>
            Analyse de réseaux réels, autonomie, communication technique.
        </p>
        <div style="text-align:center; margin-top:1rem;">
            <a href="SAE12_1.pdf" class="btn-proof" target="_blank" rel="noopener">Rendu 1 (SAE12_1)</a>
            <a href="SAE12_2.pdf" class="btn-proof" target="_blank" rel="noopener" style="margin-left:10px;">Rendu 2 (SAE12_2)</a>
        </div>
    `,
    SAE13: `
        <h2 style="text-align:center;font-size:2rem;font-weight:800;margin-bottom:.5rem;">DÉCOUVERTE D'UN DISPOSITIF DE TRANSMISSION</h2>
        <div style="text-align:center;">
            <img src="cablecoaxial.png" alt="Découverte d’un dispositif de transmission" style="max-width:360px;width:80%;margin:0 auto 1.2rem auto;display:block;border-radius:8px;">
        </div>
        <p style="font-size:1rem;line-height:1.45;">
            <strong>Objectif :</strong><br>
            Étudier une liaison physique par câble coaxial, réaliser des mesures et interpréter les résultats.
        </p>
        <div style="text-align:center; margin-top:1rem;">
            <a href="SAE13.pdf" class="btn-proof" target="_blank" rel="noopener">Compte rendu (SAE13)</a>
        </div>
    `,
    SAE14: `
        <h2 style="text-align:center;font-size:2rem;font-weight:800;margin-bottom:.5rem;">E‑RÉPUTATION</h2>
        <div style="text-align:center;">
            <img src="ereputation.png" alt="E-réputation" style="max-width:360px;width:80%;margin:0 auto 1.2rem auto;display:block;border-radius:8px;">
        </div>
        <p style="font-size:1rem;line-height:1.45;">
            Comprendre les enjeux de la gestion de son image en ligne, analyser les risques (cyberharcèlement, diffusion d'informations) et proposer des actions de protection et de sensibilisation.
        </p>
    `,
    SAE21: `
        <h2 style="text-align:center;font-size:2rem;font-weight:800;margin-bottom:.5rem;">CONSTRUIRE UN RÉSEAU POUR PETITE STRUCTURE</h2>
        <div style="text-align:center;">
            <img src="reseauentreprise.png" alt="Réseau d'entreprise" style="max-width:360px;width:80%;margin:0 auto 1.2rem auto;display:block;border-radius:8px;">
        </div>
        <p style="font-size:1rem;line-height:1.45;">
            Conception et configuration d'un réseau pour une petite structure : VLAN, routage, services (DHCP, DNS) et sécurité (pare-feu, DMZ).
        </p>
    `,
    SAE_Siteweb: `
        <h2 style="text-align:center;font-size:2rem;font-weight:800;margin-bottom:.5rem;">PREMIER SITE WEB</h2>
        <div style="text-align:center;">
            <img src="siteweb.jpg" alt="Site web" style="max-width:360px;width:80%;margin:0 auto 1.2rem auto;display:block;border-radius:8px;">
        </div>
        <p style="font-size:1rem;line-height:1.45;">
            Projet HTML/CSS initial : conception, intégration, responsive et bonnes pratiques d'accessibilité.
        </p>
        <div style="text-align:center; margin-top:1rem;">
            <a href="https://isis.unice.fr/~gm401473/acces/I_Web/R109/KawaBike/main/main.html" class="btn-proof" target="_blank" rel="noopener">Voir le site</a>
        </div>
    `
};

// Ouverture de la modale au clic sur une carte
document.querySelectorAll('.projet-card').forEach(card => {
    function openFromCard() {
        const key = card.getAttribute('data-projet');
        document.getElementById('modal-body').innerHTML = projetsContent[key] || "<p>Projet non trouvé.</p>";
        const modal = document.getElementById('modal-projet');
        modal.style.display = "flex";
        document.body.style.overflow = "hidden";
        // focus pour accessibilité
        const closeBtn = modal.querySelector('.modal-close');
        if(closeBtn) closeBtn.focus();
    }
    card.addEventListener('click', openFromCard);
    card.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openFromCard(); }
    });
});

// Fermeture de la modale
(function(){
    const modal = document.getElementById('modal-projet');
    const closeBtn = modal.querySelector('.modal-close');

    closeBtn.addEventListener('click', function(){
        modal.style.display = "none";
        document.body.style.overflow = "";
    });

    modal.addEventListener('click', function(e){
        if(e.target === modal){
            modal.style.display = "none";
            document.body.style.overflow = "";
        }
    });

    document.addEventListener('keydown', function(e){
        if(e.key === "Escape" && modal.style.display === "flex"){
            modal.style.display = "none";
            document.body.style.overflow = "";
        }
    });
})();

// Filtre simple par semestre (contrôle en haut)
document.getElementById('filter-semester').addEventListener('change', function(){
    const val = this.value;
    document.querySelectorAll('.projet-card').forEach(card => {
        if(val === 'all' || card.getAttribute('data-semester') === val) {
            card.style.display = '';
        } else {
            card.style.display = 'none';
        }
    });
});
</script>
